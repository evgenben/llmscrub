upstream payapi {
    server 10.20.30.21:8443;
    server 10.20.30.22:8443 backup;
}
server {
    listen 198.51.100.30:443 ssl;
    server_name pay.acmepay.internal api.acmepay.internal;
    ssl_certificate     /etc/ssl/acme/pay.acmepay.internal.crt;
    ssl_certificate_key /etc/ssl/acme/pay.acmepay.internal.key;
    allow 10.20.16.0/20;
    allow 192.168.50.0/24;
    deny all;
    location / {
        proxy_pass https://payapi;
        proxy_set_header Authorization "Basic aXZhbm92OlN1cDNyJGVjcmV0IQ==";
    }
    resolver 10.20.30.2 8.8.8.8;
}
