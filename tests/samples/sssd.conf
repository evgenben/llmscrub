[sssd]
domains = acme.lan
services = nss, pam, sudo, ssh

[domain/acme.lan]
id_provider = ipa
ipa_server = _srv_, ipa01.acme.lan
ipa_domain = acme.lan
ipa_hostname = db01.acme.lan
krb5_realm = ACME.LAN
ldap_uri = ldaps://ipa01.acme.lan
ldap_search_base = dc=acme,dc=lan
ldap_default_bind_dn = uid=svc-ldap,cn=sysaccounts,cn=etc,dc=acme,dc=lan
ldap_default_authtok_type = password
ldap_default_authtok = BindPw-2024!x
simple_allow_users = ivanov, petrova
cache_credentials = True
