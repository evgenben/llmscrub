table inet filter {
  set admin_nets { type ipv4_addr; flags interval; elements = { 10.20.16.0/20, 192.168.50.0/24 } }
  chain input {
    type filter hook input priority 0; policy drop;
    ip saddr @admin_nets tcp dport 22 accept
    ip saddr 198.51.100.0/24 tcp dport 443 accept
    ip saddr 10.20.30.21 tcp dport 5432 accept
    iif lo accept
  }
}
