[libdefaults]
  default_realm = ACME.LAN
  dns_lookup_kdc = true
[realms]
  ACME.LAN = {
    kdc = ipa01.acme.lan:88
    admin_server = ipa01.acme.lan:749
    pkinit_anchors = FILE:/var/lib/ipa-client/pki/kdc-ca-bundle.pem
  }
[domain_realm]
  .acme.lan = ACME.LAN
  acme.lan = ACME.LAN
  db01.acme.lan = ACME.LAN
